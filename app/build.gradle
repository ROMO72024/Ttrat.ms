plugins {
    id 'com.android.application'
}

def releaseKeyFile = System.getenv('GHARS_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('GHARS_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('GHARS_KEY_ALIAS')
def releaseKeyPassword = System.getenv('GHARS_KEY_PASSWORD')
def hasReleaseSigning = releaseKeyFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
// Actual package from the user's original app-debug.apk (versionCode 3).
// Keep the namespace for Java classes; the install identity must match the APK.
def legacyApplicationId = 'ps.ghars.sessions.debug'

android {
    namespace 'ps.ghars.sessions'
    compileSdk 35

    defaultConfig {
        applicationId legacyApplicationId
        manifestPlaceholders = [gharsAppLabel: 'أخصائية غرس']
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.1.1'
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseKeyFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        htmlReport true
        xmlReport true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
